<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>body { margin: 0; }</style>
</head>
<body>
<a-scene mindar-image="imageTargetSrc: ./magic.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-assets>
    <img id="cat" src="./cat-summon.png">
  </a-assets>
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="target" mindar-image-target="targetIndex: 0">
    <a-entity id="summon" scale="0.001 0.001 0.001"
      animation="property: scale; to: 1 1 1; dur: 900; easing: easeOutElastic; startEvents: summon">
      <a-image src="#cat" width="1" height="1" position="0 0 0.5" rotation="90 0 0"></a-image>
    </a-entity>
  </a-entity>
</a-scene>

<script>
  const target = document.getElementById("target");
  const summon = document.getElementById("summon");
  target.addEventListener("targetFound", () => summon.emit("summon"));
  target.addEventListener("targetLost", () => summon.setAttribute("scale", "0.001 0.001 0.001"));
</script>
</body>
</html>
