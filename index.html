<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<style>
  body { margin: 0; }
  #text {
    position: fixed; left: 0; right: 0; bottom: 12%;
    text-align: center; font-size: 28px; color: #fff;
    text-shadow: 0 0 6px #000, 0 0 6px #000;
    font-family: "Hiragino Mincho ProN", serif;
    z-index: 10; pointer-events: none;
  }
</style>
</head>
<body>
<div id="text"></div>

<a-scene mindar-image="imageTargetSrc: ./cat.mind;" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
  <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
</a-scene>

<script>
  const message = "吾輩は猫でAR。名前はまだ無い。";
  const el = document.getElementById("text");
  let timer = null;

  document.getElementById("target").addEventListener("targetFound", () => {
    let i = 0;
    el.textContent = "";
    clearInterval(timer);
    timer = setInterval(() => {
      el.textContent = message.slice(0, ++i);
      if (i >= message.length) clearInterval(timer);
    }, 120);
  });

  document.getElementById("target").addEventListener("targetLost", () => {
    clearInterval(timer);
    el.textContent = "";
  });
</script>
</body>
</html>
